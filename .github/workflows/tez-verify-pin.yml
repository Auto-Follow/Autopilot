name: PX4 v1.17.0 surum kilidi

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false
      - name: Surum kilidini dogrula
        run: bash tez/pin/verify_pin.sh
