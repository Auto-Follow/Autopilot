# Same rules as Vision/pyproject.toml; longer lines because the tools print Turkish report lines.
#   ../Vision/.venv/bin/ruff format tez/sim && ../Vision/.venv/bin/ruff check tez/sim
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN"]
ignore = ["ANN401"]

[lint.isort]
# modules in araclar/ import each other by plain name (the scripts run from that folder)
known-first-party = ["algilama", "animasyon", "dogrulama", "gecikme", "goruntu", "goruntu_yayini", "hedef", "kamera", "kayit", "konumlama", "kusurlar", "model_dene", "olcum", "onizleme", "parametreler", "px4_baglanti", "rapor", "senaryo", "simulasyon", "takip", "tarama", "toplu", "video", "yuruyus"]
