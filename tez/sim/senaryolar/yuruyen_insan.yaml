# Yürüyen insan: dronun 10 m önünde başlar, uzaklaşır, durur, kuzeye koşar, batıya yürür.
#
#   ~/Desktop/Projects/Auto-Follow/.venv-tez/bin/python tez/sim/araclar/senaryo.py --senaryo yuruyen_insan
#
# Koordinatlar: Gazebo dünyası, x doğu, y kuzey [m]. Dron (0, 0)'dan doğuya bakarak kalkar.
# 45° kamera + 10 m yükseklikte kamera ekseni yere ~10 m ileride değer: hedef başta kadrajın ortasındadır.

ad: yuruyen_insan
aciklama: >
  İnsan dronun 10 m önünde durur; 60. saniyede doğuya yürür, 3 s durur, kuzeye koşar, sonra batıya yürür.
  Dron senaryo boyunca tez modundadır (iskelet mod: yerinde bekler), yani hedef kadrajdan çıkar.

dunya: duz_alan

drone:
  yukseklik_m: 10
  mod: tez                  # tez: "Tez Auto Follow" | bekle: PX4 Hold

hedef:
  tur: insan
  baslangic: [10, 0]
  yol:                      # sırayla: {nokta, hiz_mps} yürü (hız > 2 m/s ise koşu animasyonu), {dur_s} bekle
    - {nokta: [22, 0], hiz_mps: 1.4}
    - {dur_s: 3}
    - {nokta: [22, 10], hiz_mps: 3.0}
    - {nokta: [12, 10], hiz_mps: 1.4}

zamanlama:
  baslama_s: 60             # hedef bu simülasyon zamanında yürümeye başlar; dron o ana kadar hazır olmalı
  son_bekleme_s: 5          # son adımdan sonra kayda devam süresi

basari: {}                  # F2'den itibaren, ör. {kadrajda_kalma_min: 0.9, en_uzun_kayip_max_s: 3}
