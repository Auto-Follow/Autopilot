# Takip eden yürüyüş, 8 m / 8 m: takip_yuruyen'in aynısı, dron 8 m yükseklikten kişiyi 8 m geriden izler.
#
#   ~/Desktop/Projects/Auto-Follow/.venv-tez/bin/python tez/sim/araclar/senaryo.py --senaryo takip_yuruyen_8m
#
# Kamera raporunun stad ayarı 8/8 (45° kamera: yükseklik = geride durma) ve gerçek dronun 22.08 parametreleri.
# 6–9. görev gruplarının takip_yuruyen'i buydu (demo koşuları, FLW_TGT_RS karşılaştırması); kullanıcı kararıyla (14.11)
# takip_yuruyen 10 m / 10 m oldu, bu ayar karşılaştırma için ayrı senaryo olarak kalır. 9. grupta ölçülen: köşede dron
# kişiye 0.45–1.94 m yaklaşıyor ve kişi kadrajdan çıkınca stok mod onu bir daha bulamıyor (3/3 koşu;
# implementation/gorev-grubu-09.md). Gerçek uçuşta hangi ayarın kullanılacağı ekip kararıdır (m22/m25).
# 45° kamera 8 m'de yeri dronun ~3.9–17.4 m önünde görür; kişi ≈ 215 px boyunda.
# Kişinin yolu ve zamanlaması takip_yuruyen ile aynıdır (karşılaştırılabilir olsun diye); kişi dronun 10 m önünde başlar.

ad: takip_yuruyen_8m
aciklama: >
  İnsan dronun 10 m önünde durur; 60. saniyede doğuya yürür, 3 s durur, kuzeye koşar, sonra batıya yürür
  (takip_yuruyen'in yolu). Dron 8 m yükseklikten stok PX4 Follow Me ile hedefi 8 m geriden izler; hedefin konumu
  model kutusundan düz zemin hesabıyla bulunur.

dunya: duz_alan

drone:
  yukseklik_m: 8            # FLW_TGT_HT verilmediği için Follow Me yüksekliği de 8 m

takip:
  kaynak: follow_me
  los: model
  px4_parametreleri:
    FLW_TGT_DST: 8          # kamera raporu, stad 8/8 (45° kamerada yükseklik = geride durma)
    FLW_TGT_RS: 0.3         # takip_yuruyen ile aynı sim seçimi (karar 1, 13.11; gerçek dronda 0.1)

hedef:
  tur: insan
  baslangic: [10, 0]
  yol:
    - {nokta: [22, 0], hiz_mps: 1.4}
    - {dur_s: 3}
    - {nokta: [22, 10], hiz_mps: 3.0}
    - {nokta: [12, 10], hiz_mps: 1.4}

zamanlama:
  baslama_s: 60
  son_bekleme_s: 5

basari: {}
