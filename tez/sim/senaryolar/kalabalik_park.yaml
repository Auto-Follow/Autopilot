# Kalabalık park: çayır dünyasında hedef ve dört kişi daha. Görüntü işleme için karıştırma ve örtülme senaryosu.
#
#   ~/Desktop/Projects/Auto-Follow/.venv-tez/bin/python tez/sim/araclar/senaryo.py --senaryo kalabalik_park
#
# Koordinatlar: Gazebo dünyası, x doğu, y kuzey [m]. Dron (0, 0)'dan doğuya bakarak kalkar; 10 m'den kamera
# yaklaşık x = 5–21 m arasını görür. (13, 5)'teki çam, arkasından geçen insanları dronun kamerasından gizler.
# Doğru cevapta hedef "hedef_*", diğerleri "insan1_*" ... sütunlarındadır; "gorunur" hedefin gerçekten görünüp
# görünmediğini (ağaç arkasında değil) söyler, "hedef_kutu_*" görüntüdeki kutusudur.

ad: kalabalik_park
aciklama: >
  Hedef (mavi üst) patikanın yanından yürür, çamın arkasından geçer, durur ve geri döner. Bir kişi patikada yürür,
  biri çapraz koşar, biri bir süre durup sonra yavaşça yürür, biri de hedefle aynı kıyafetle hedefin yolunu keser.
  Dron takip etmez (takip kaynağı yok: PX4 Hold'da yerinde bekler).

dunya: cayir

drone:
  yukseklik_m: 10

takip:
  kaynak: yok

hedef:
  tur: insan
  baslangic: [7, -1]
  kiyafet: {ust: mavi, alt: siyah}
  davranis: {tohum: 11}
  yol:
    - {nokta: [11, -1], hiz_mps: 1.3}
    - {nokta: [15, 2], hiz_mps: 1.4}
    - {nokta: [15.5, 7], hiz_mps: 1.2}      # dronun kamerasından bakınca çamın arkası
    - {dur_s: 4}
    - {nokta: [10, 8], hiz_mps: 1.4}
    - {nokta: [7, 3], hiz_mps: 1.5}

diger_insanlar:
  - baslangic: [-2, -7]                     # patikada yürüyen
    kiyafet: {ust: beyaz, alt: bej, ten: acik}
    davranis: {tohum: 21}
    yol:
      - {nokta: [10, -4], hiz_mps: 1.4}
      - {nokta: [28, 5], hiz_mps: 1.4}
  - baslangic: [18, -8]                     # çapraz koşan
    gecikme_s: 8
    kiyafet: {ust: kirmizi, alt: siyah, ten: esmer}
    davranis: {tohum: 22}
    yol:
      - {nokta: [5, 9], hiz_mps: 3.2}
  - baslangic: [9, 6]                       # duran, sonra yavaşça yürüyen
    kiyafet: {ust: sari, alt: kot, ten: koyu}
    davranis: {tohum: 23}
    yol:
      - {dur_s: 20}
      - {nokta: [5, 3], hiz_mps: 0.8}
  - baslangic: [16, -3]                     # hedefle aynı kıyafet, hedefin yolunu keser
    gecikme_s: 14
    kiyafet: {ust: mavi, alt: siyah}
    davranis: {tohum: 24}
    yol:
      - {nokta: [10, 4], hiz_mps: 1.5}
      - {nokta: [4, 2], hiz_mps: 1.4}

zamanlama:
  baslama_s: 60
  son_bekleme_s: 5

basari: {}
