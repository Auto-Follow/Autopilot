# Takip eden yürüyüş, 10 m / 10 m: takip_yuruyen'in aynısı, dron 10 m yükseklikten kişiyi 10 m geriden izler.
#
#   ~/Desktop/Projects/Auto-Follow/.venv-tez/bin/python tez/sim/araclar/toplu.py --senaryo takip_yuruyen_10m --tekrar 3
#
# Kamera raporunun "çim alanın açık kısmı" ayarı (10/10, 45° kamera: yükseklik = geride durma). 9. görev grubunda
# varsayılan 8/8 ile karşılaştırmak için eklendi (kullanıcının sorusu 13.11: dron hedefe neden bu kadar yakın?);
# varsayılan takip_yuruyen 8/8 kalır, karar kullanıcıda (implementation/gorev-grubu-09.md).
# 45° kamera 10 m'de yeri ≈ 4.8 m'den (yakın görüş sınırı) ≈ 21.7 m'ye kadar görür; kişi ≈ 155 px boyunda.
# Kişinin yolu ve zamanlaması takip_yuruyen ile aynıdır (karşılaştırılabilir olsun diye); kişi dronun 10 m önünde başlar.

ad: takip_yuruyen_10m
aciklama: >
  İnsan dronun 10 m önünde durur; 60. saniyede doğuya yürür, 3 s durur, kuzeye koşar, sonra batıya yürür
  (takip_yuruyen'in yolu). Dron 10 m yükseklikten stok PX4 Follow Me ile hedefi 10 m geriden izler; hedefin konumu
  model kutusundan düz zemin hesabıyla bulunur.

dunya: duz_alan

drone:
  yukseklik_m: 10           # FLW_TGT_HT verilmediği için Follow Me yüksekliği de 10 m

takip:
  kaynak: follow_me
  los: model
  px4_parametreleri:
    FLW_TGT_DST: 10         # kamera raporu, çim alan 10/10 (45° kamerada yükseklik = geride durma)
    FLW_TGT_RS: 0.3           # takip_yuruyen ile aynı sim seçimi (karar 1, 13.11; gerçek dronda 0.1)

hedef:
  tur: insan
  baslangic: [10, 0]
  yol:
    - {nokta: [22, 0], hiz_mps: 1.4}
    - {dur_s: 3}
    - {nokta: [22, 10], hiz_mps: 3.0}
    - {nokta: [12, 10], hiz_mps: 1.4}

zamanlama:
  baslama_s: 60
  son_bekleme_s: 5

basari: {}
