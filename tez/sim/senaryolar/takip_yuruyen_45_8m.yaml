# Takip eden yürüyüş, 45° montaj, 8 m / 8 m (eski adı takip_yuruyen_8m): kamera 45° aşağı, dron 8 m yükseklikten
# kişiyi 8 m geriden izler (kamera raporunun stad ayarı 8/8 ve gerçek dronun 22.08 parametreleri).
#
#   ~/Desktop/Projects/Auto-Follow/.venv-tez/bin/python tez/sim/araclar/senaryo.py --senaryo takip_yuruyen_45_8m
#
# 6–9. görev gruplarının takip_yuruyen'i buydu (demo koşuları, FLW_TGT_RS karşılaştırması). Simin varsayılanı
# 35° · 9 m / 12.9 m oldu (takip_yuruyen, karar 14.11); bu senaryo karşılaştırma için 45° montajı tutar: eğim dosyada
# yazılı (koşu klasörüne modelin 45° kopyası yazılır). Ölçülen: köşede dron kişiye 0.45–2.19 m yaklaşıyor ve kişi
# kadrajdan çıkınca stok mod onu bir daha bulamıyor (7 koşuda 1'inde izlendi; gorev-grubu-09.md, Görev Grubu 17
# belgesi). Gerçek uçuşta hangi ayarın kullanılacağı ekip kararıdır (m22/m25).
# 45° kamera 8 m'de yeri dronun ~3.9–17.4 m önünde görür; kişi ≈ 215 px boyunda.
# Kişinin yolu ve zamanlaması yuruyen_insan'ınki (kişi dronun 10 m önünde başlar), 6–9. grupların koşularıyla aynı.

ad: takip_yuruyen_45_8m
aciklama: >
  İnsan dronun 10 m önünde durur; 60. saniyede doğuya yürür, 3 s durur, kuzeye koşar, sonra batıya yürür
  (yuruyen_insan'ın yolu). Kamera 45° aşağı; dron 8 m yükseklikten stok PX4 Follow Me ile hedefi 8 m geriden izler;
  hedefin konumu model kutusundan düz zemin hesabıyla bulunur.

dunya: duz_alan

drone:
  yukseklik_m: 8            # FLW_TGT_HT verilmediği için Follow Me yüksekliği de 8 m

takip:
  kaynak: follow_me
  los: model
  px4_parametreleri:
    FLW_TGT_DST: 8          # kamera raporu, stad 8/8 (45° kamerada yükseklik = geride durma)
    FLW_TGT_RS: 0.3         # takip_yuruyen ile aynı sim seçimi (karar 1, 13.11; gerçek dronda 0.1)

kamera:
  egim_deg: 45              # 45° montaj (karşılaştırma); simin varsayılanı 35° (kamera.NOMINAL_TILT_DEG)

hedef:
  tur: insan
  baslangic: [10, 0]
  yol:
    - {nokta: [22, 0], hiz_mps: 1.4}
    - {dur_s: 3}
    - {nokta: [22, 10], hiz_mps: 3.0}
    - {nokta: [12, 10], hiz_mps: 1.4}

zamanlama:
  baslama_s: 60
  son_bekleme_s: 5

basari: {}
